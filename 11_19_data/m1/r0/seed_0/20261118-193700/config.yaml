  max_logged_objects: 10
eval:
  n_episodes: 20
  n_workers: 4
  freq_control_steps: 100000
  deterministic: true
training:
  total_control_steps: 2000000
  n_envs: 14
  checkpoint_freq_control_steps: 100000
  device: auto
  torch_threads: 2
  gamma_ref: 0.99
ppo:
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    normalize_images: false
scenario:
  name: freeway
  traffic:
    density: 0.1
    mode: Trigger
  seeds:
