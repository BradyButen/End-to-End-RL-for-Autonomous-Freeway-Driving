experiment:
  method: m1
  reward_variant: r0
  scenario: freeway
  seed: 0
  runs_root: runs
sim:
  physics_world_step_size: 0.02
  decision_repeat: 5
  control_dt: 0.1
  horizon: 1200
  on_continuous_line_done: true
  log_level: 50
  metadrive_overrides:
    force_destroy: true
  map:
    blocks: SSSSSSSSSSSSSSSS
    lane_num: 3
    lane_width: 3.5
  ego:
    spawn_speed_km_h: 40
    random_spawn_lane: true
    max_steering_deg: 40
    max_speed_km_h: 80
    front_wheelbase: 1.05234
    rear_wheelbase: 1.4166
    length: 4.515
    width: 1.852
  perception_range: 50.0
  target_speed_km_h: 70
  v_cap_km_h: 80
observation:
  bev:
    resolution: 84
    distance: 100.0
    frame_stack: 3
    post_stack: 5
    frame_skip: 5
  ego_features:
  - v
  - d
  - psi_err
  - steering
  - throttle_brake
actuation:
  table:
  - - -1.0
    - -15.805
  - - -0.6
