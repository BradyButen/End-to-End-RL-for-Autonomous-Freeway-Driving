experiment:
  method: m3
  reward_variant: r0
  scenario: freeway
  seed: 0
  runs_root: runs
sim:
  physics_world_step_size: 0.02
  decision_repeat: 5
  control_dt: 0.1
  horizon: 1200
  on_continuous_line_done: true
  log_level: 50
  metadrive_overrides:
    force_destroy: true
  map:
    blocks: SSSSSSSSSSSSSSSS
    lane_num: 3
    lane_width: 3.5
  ego:
    spawn_speed_km_h: 40
    random_spawn_lane: true
    max_steering_deg: 40
    max_speed_km_h: 80
    front_wheelbase: 1.05234
    rear_wheelbase: 1.4166
    length: 4.515
    width: 1.852
  perception_range: 50.0
  target_speed_km_h: 70
  v_cap_km_h: 80
observation:
  bev:
    resolution: 84
    distance: 100.0
    frame_stack: 3
    post_stack: 5
    frame_skip: 5
  ego_features:
  - v
  - d
  - psi_err
  - steering
  - throttle_brake
actuation:
  table:
  - - -1.0
    - -15.805
  - - -0.6
    - -11.703
  - - -0.3
    - -7.936
  - - -0.15
    - -4.091
  - - -0.05
    - -1.364
  - - 0.0
    - -0.364
  - - 0.02
    - 0.058
  - - 1.0
    - 2.909
logging:
  full_log_eval: true
  train_full_log_every: 50
  max_logged_objects: 10
eval:
  n_episodes: 20
  n_workers: 4
  freq_control_steps: 100000
  deterministic: true
training:
  total_control_steps: 2000000
  n_envs: 14
  checkpoint_freq_control_steps: 100000
  device: auto
  torch_threads: 2
  gamma_ref: 0.99
ppo:
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    normalize_images: false
scenario:
  name: freeway
  traffic:
    density: 0.1
    mode: Trigger
  seeds:
    train_low: 0
    train_high: 1000
    eval:
    - 1000
    - 1001
    - 1002
    - 1003
    - 1004
    - 1005
    - 1006
    - 1007
    - 1008
    - 1009
    - 1010
    - 1011
    - 1012
    - 1013
    - 1014
    - 1015
    - 1016
    - 1017
    - 1018
    - 1019
method:
  name: m3
  decision_period: 10
  n_slots: 5
  ds_range:
  - 5.0
  - 40.0
  lateral_margin: 1.0
  safe_set:
    enabled: true
    edge_margin: 0.2
    obj_margin_s: 2.0
    obj_margin_d: 0.5
    time_uncertainty: 0.5
    min_speed_for_timing: 5.0
    max_slope: 0.16
    max_lat_accel: 3.0
    reach_time: 10.0
    min_ds: 2.0
    infeasible_penalty_distance: 10.0
  spline:
    ds: 1.0
    extend: 80.0
  mpc:
    horizon: 20
    steer_lag: 0.1
    dt: 0.1
    weights:
      lateral: 2.0
      heading: 2.0
      speed: 0.5
      steer: 1.0
      accel: 0.05
      steer_rate: 20.0
      accel_rate: 0.5
      terminal_factor: 3.0
    accel_bounds:
    - -6.0
    - 2.5
    max_lat_accel: 4.0
    max_fallback_shift: 5
    steer_rate_limit: 0.6
    corridor:
      horizon: 3.0
      rebuild_period: 10
      margin_s: 1.0
      margin_d: 0.3
      edge_margin: 0.1
      cap_forward: 20.0
      cap_backward: 10.0
      cap_lateral: 5.25
      lane_change_heading: 0.035
      accel: 2.0
      brake: 4.0
      stop_buffer: 2.0
    solver:
      max_iter: 100
      max_cpu_time: 0.1
      tol: 0.001
      print_level: 0
reward:
  name: r0
  terminal_mode: replace
  terminal_priority:
  - success
  - off_road
  - collision
  weights:
    progress: 1.0
    speed: 0.1
    success: 10.0
    off_road: -5.0
    collision: -5.0
    speed_tracking: 0.0
    lane_center: 0.0
    jerk: 0.0
    steer_rate: 0.0
    time: 0.0
    projection_penalty: 0.0
