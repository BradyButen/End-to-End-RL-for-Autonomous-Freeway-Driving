# Base configuration. Merge order (src/handoff/config.py):
#   base.yaml -> <scenario>.yaml (freeway) -> <method>.yaml (m1 m2 m3 b0) -> <reward>.yaml (r4_straight) -> --set key.sub=value

experiment:
  method: m1               # set by <method>.yaml
  reward_variant: r4_straight  # set by <reward>.yaml
  scenario: freeway        # set by <scenario>.yaml
  seed: 0                  # training seed (PPO init + training-episode seed stream)
  runs_root: runs

sim:
  physics_world_step_size: 0.02
  decision_repeat: 5        # control step = 0.1 s
  control_dt: 0.1
  store_map: false          # MetaDrive's map cache (default true) keeps every visited seed's map in each process
                            # (~10 MB each, 1040 seeds): memory grew ~10 MB per episode until OOM. false = rebuild
  horizon: 1500             # control steps before timeout (truncated); 150 s (longest route 1144 m = 103 s at the
                            # 40 km/h traffic speed; 120 s left too little margin)
  on_continuous_line_done: true
  log_level: 50             # MetaDrive logging (50 = CRITICAL only)
  render_clean: false       # viewer only: hide MetaDrive's navigation marks, dashboard and FPS counter
  metadrive_overrides:
    # Destroy objects on reset instead of reusing MetaDrive's object buffer: makes physics bit-exact across
    # episodes in one process (reused objects carry ~1e-5 m state noise that closed loops amplify), which
    # deterministic replay relies on (docs/DESIGN.md D-11).
    force_destroy: true
  map:
    # MetaDrive PG block string: "S" = straight block, length drawn from the seed in [40, 80] m. 16 blocks
    # + the first block give a straight road of roughly 1 km. Two-way (stock); crossing the centre line ends
    # the episode (on_continuous_line_done).
    blocks: SSSSSSSSSSSSSSSS
    lane_num: 3
    lane_width: 3.5
  ego:
    # Ego vehicle: MetaDrive "static_default" = the default car body with FIXED dynamics (engine 800, brake 150,
    # friction 0.9, steering 40 deg). The stock "default" model resamples engine 750-850 / brake 80-180 every
    # episode (pilot round 1 trained on that); the M2/M3 controllers were tuned on static_default.
    # Spawn: first block, fixed speed, lane spawn_lane (null = random every episode; 0 = next to the centre line).
    vehicle_model: static_default
    spawn_speed_km_h: 40
    spawn_lane: null
    max_steering_deg: 40      # default vehicle's max steering (used to convert steering commands to radians)
    max_speed_km_h: 80
    front_wheelbase: 1.05234
    rear_wheelbase: 1.4166
    length: 4.515
    width: 1.852
  perception_range: 50.0    # R, metres; ObjectList radius
  target_speed_km_h: 70     # global target speed
  v_cap_km_h: 80            # speed cap (M2 action range, M3 MPC constraint)

observation:
  bev:
    resolution: 84
    # MetaDrive "distance" is the SIDE LENGTH of the ego-centred square window, so 100 m => +/-50 m = R.
    distance: 100.0
    frame_stack: 3
    post_stack: 5
    frame_skip: 5
  ego_features: [v, d, psi_err, steering, throttle_brake]

# Actuation mapping a [m/s^2] <-> throttle_brake (M2 speed feed-forward, M3 MPC; no system identification).
# Static lookup table measured once with scripts/calibrate_actuation.py (open-loop full/partial
# throttle and brake on the bare map). Pairs are (throttle_brake, longitudinal accel m/s^2), sorted.
actuation:
  # Measured at 15 m/s, 2026-11-16. Positive throttle is linear (a = 2.909 u, no drag); u = 0 exactly coasts at
  # -0.36 m/s^2 (parking brake 2.0 applied), so a tiny positive point is included to map a = 0 -> u ~ 0.0125.
  table:
    - [-1.0, -15.805]
    - [-0.6, -11.703]
    - [-0.3, -7.936]
    - [-0.15, -4.091]
    - [-0.05, -1.364]
    - [0.0, -0.364]
    - [0.02, 0.058]
    - [1.0, 2.909]

logging:
  full_log_eval: true
  train_full_log_every: 50     # every Nth training episode per env gets full control/decision logs
  tube_every: 10               # M3: store the corridor in full logs every Nth control step (it is rebuilt every step)
  max_logged_objects: 10

eval:
  n_episodes: 40               # first N of scenario.seeds.eval (40 -> 2.5 % resolution on rates)
  n_workers: 1                 # parallel evaluation subprocesses (one MetaDrive each); raise on clusters
  freq_control_steps: 200000   # evaluate every N control steps (summed over envs)
  deterministic: true

training:
  total_control_steps: 2000000
  max_wall_minutes: null       # safety stop for the training loop (step-0 / periodic evals included); the final eval
                               # and final.zip still run after it, so leave ~30 min (M3: ~45) before the Slurm limit
  progress_seconds: 60         # print a one-line status (time, steps/s, episodes, recent return/success/crash)
  n_envs: 4
  checkpoint_freq_control_steps: 100000
  device: auto                 # "auto" = cuda if available else cpu; or "cpu" / "cuda" / "cuda:0"
  torch_threads: null          # CPU threads for PPO updates in the main process (null = torch default)
  gamma_ref: 0.99              # per-0.1 s discount; gamma_method = gamma_ref ** (T_decision / 0.1)  (~10 s lookahead)
  gae_lambda_ref: 0.995        # per-0.1 s GAE lambda; lambda_method = gae_lambda_ref ** (T_decision / 0.1)
                               # -> M1 0.995, M2 0.975, M3 0.951 (same ~7 s credit window for all); replaces ppo.gae_lambda
  normalize_reward: true       # SB3 VecNormalize on rewards only (running return std); logs/eval stay raw
  reward_clip: 100.0           # clip of the normalised reward (10 would clip the -500 crash penalty early in training)
  watchdog_minutes: 15         # kill the job (exit 3) if nothing progresses for this long (hung worker): env start-up,
                               # PPO steps, each eval episode and shutdown count. Must exceed one M3 eval episode
                               # (<= 150 s simulated, a few min wall) and one PPO update. 0 disables.
                               # A crashed worker (exception / segfault) ends the job immediately instead.
  # Warm start (docs/human-data-pipeline.md). All off by default: a normal run starts PPO from random weights.
  init_policy: null            # SB3 .zip (e.g. a behaviour-cloning clone from scripts/bc.py): its ACTOR (CNN, policy
                               # MLP, action head) is loaded; the critic and log_std stay freshly initialised.
                               # Must be for the same method / observation / action space. Relative to the repo root.
  init_log_std: null           # with init_policy: initial log action std (null = ppo.policy_kwargs.log_std_init).
                               # The clone's actions are precise (human steering std ~0.06); the default std 0.5 would
                               # bury them in noise. -2.0 -> std 0.135.
  critic_warmup_control_steps: 0   # with init_policy: train ONLY the value net (actor + CNN frozen) for this many
                               # control steps first, so the first PPO updates use a sensible advantage estimate
                               # instead of a random critic's and do not wreck the loaded actor. 0 = off.

ppo:                           # SB3 PPO kwargs (defaults unless overridden in method/*.yaml)
  learning_rate: 0.0003
  n_steps: 2048                # overridden per method (configs/m1.yaml, m2.yaml, m3.yaml): 128 s of driving per env per rollout
  batch_size: 64
  n_epochs: 10
  clip_range: 0.2
  ent_coef: 0.0                # no entropy bonus: exploration is set by log_std_init; a bonus would fight it
  vf_coef: 0.5
  max_grad_norm: 0.5
  policy_kwargs:
    normalize_images: false
    log_std_init: -0.7         # initial action std 0.5 (SB3 default 0 -> std 1: ~32 % of samples clipped to ±1)
