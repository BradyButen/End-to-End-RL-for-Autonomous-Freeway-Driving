# Stock MetaDrive straight freeway with MetaDrive's own traffic (PGTrafficManager, stock IDMPolicy cars, cruise
# speed overridden to traffic.speed_km_h). Cars are placed randomly over the route (all blocks but the first) and
# all drive from t = 0 at that speed. Each seed = a different map (block lengths drawn from the seed) + traffic.
experiment:
  scenario: freeway

scenario:
  name: freeway
  traffic:
    density: 0.15         # MetaDrive traffic_density (vehicles per 10 m of lane, roughly); round 1 was 0.1
    speed_km_h: 40        # IDM cruise speed of traffic (MetaDrive's built-in is 30); null = stock
    lane_speed_offset_km_h: [5, 0, -5]   # added per lane (0 = left, by the centre line): 45 / 40 / 35 km/h
    mode: Trigger         # MetaDrive TrafficMode: Trigger = random positions over every block but the first
    release_all_at_reset: true   # all cars drive from t = 0 at speed_km_h (no waiting for the ego to reach a block)

  seeds:
    # MetaDrive seeds. Training draws from [train_low, train_high); evaluation uses the fixed list below.
    train_low: 0
    train_high: 1000
    eval: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009,
           1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019,
           1020, 1021, 1022, 1023, 1024, 1025, 1026, 1027, 1028, 1029,
           1030, 1031, 1032, 1033, 1034, 1035, 1036, 1037, 1038, 1039]
