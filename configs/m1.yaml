# M1: end-to-end. RL outputs [target lateral accel, target accel] every control step (src/handoff/m1.py).
experiment:
  method: m1

method:
  name: m1
  decision_period: 1           # control steps per RL decision
  accel_range: [-4.0, 2.9]     # m/s^2 for action -1 / +1 (0 = hold speed), via the actuation table. +2.9 = full
                               # throttle. -4 (not the -15.8 of full brake) keeps zero-mean noise near zero net accel:
                               # bias = std * 0.8 * (2.9 - 4) / 2, about -0.2 m/s^2 at std 0.5
  steer_lat_accel: 8.0         # m/s^2 for lateral action +-1 (wheel angle from the speed: ~2.2 deg at 80 km/h).
                               # Near MetaDrive's grip (~8.8); the human demos peak at ~9.3

training:                      # 7.5 h job: the wall clock (450 min) is the stop; the budget is set above what it can
  total_control_steps: 25000000  # reach (laptop ~420 steps/s with 12 envs -> ~11M in 7.5 h; Great Lakes 14 envs, more)
  max_wall_minutes: 450
  init_log_std: [-1.9, -0.7]   # std [lateral 0.15 = 1.2 m/s^2, accel 0.5 = ~1.5 m/s^2]: braking gets sampled (the
                               # warm clone sits at accel +0.8, so std 0.135 never tried a brake: 0.4 % of steps)

ppo:                           # round 2: smaller, stabler updates (pilot approx_kl ~0.17, clip_fraction 0.4-0.5)
  n_steps: 1280                # decisions per env per rollout = 128 s of driving, same as M2 (256 x 0.5 s), M3 (128 x 1 s)
  n_epochs: 4
  batch_size: 512
  target_kl: 0.03
