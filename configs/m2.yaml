# M2: RL picks (d*, v*) every 0.5 s; quintic lateral + accel-limited speed profile; cascaded PID tracks it
# (src/handoff/m2.py).
experiment:
  method: m2

method:
  name: m2
  decision_period: 5           # N2 control steps (0.5 s)
  lateral_margin: 1.0          # d* range = [d_min - margin, d_max + margin]  (NOT clipped)
  trajectory:
    horizon: 1.5               # T_traj (s). Was 2.0. With replanning every 0.5 s the flown path matches a target
                               # path when the target is read ~0.7 T ahead; T 1.5 + human labels 1 s ahead reproduce
                               # the human drives to 0.09 m rms, no timing offset (T 2 / 2 s: 0.60 m, 0.7 s early ->
                               # sideswipes). A full lane change in 1.5 s peaks ~9 m/s^2 (M3 limit 9.3); T 1.0 would
                               # let the RL ask for ~20 m/s^2
    dt: 0.1
    accel_limit: 2.0           # speed-profile acceleration limit (m/s^2)
    decel_limit: 4.0           # speed-profile deceleration limit (m/s^2)
  pid:
    # Tuned 2026-11-19 on the kinematic bicycle + 0.12 s steering lag (scripts/matlab/m2_pid_tuning.m).
    # Was heading [1.7, 0.01, 3.5], lateral [0.3, 0.002, 0.05], speed [0.6, 0.02, 0.0] (MetaDrive LaneChangePolicy).
    heading: [1.0, 0.005, 0.0]
    lateral: [0.06, 0.0005, 0.0]
    speed: [0.25, 0.0008, 0.0] # on (v_ref - v) in m/s -> throttle_brake
    integral_limit: 5.0
    speed_feedforward: true    # add a_ref -> throttle_brake feed-forward from the actuation table

training:                      # 7.5 h job: ~185 steps/s on standard (~5M possible). Round 3 memory grew to 72 GB at
  total_control_steps: 4500000 # 2.2M steps (MetaDrive's map cache, now off: sim.store_map). Check that the `mem` line
  max_wall_minutes: 450        # stays flat; if it still climbs ~30 GB/M steps, 3.5M is the 140 GB-safe budget

ppo:                           # round 2: more updates per control step (pilot: ~14 updates in 2M steps)
  n_steps: 256                 # decisions per env per rollout (= 128 s of driving, same as M1/M3)
  batch_size: 256
  n_epochs: 4                  # round 3: update guard (approx_kl rose 0.006 -> 0.55, clip fraction 0.66, eval
  target_kl: 0.03              # success 1.0 -> 0 after 1.2M steps); same guard as M1, plus a smaller step size
  learning_rate: 0.0001
