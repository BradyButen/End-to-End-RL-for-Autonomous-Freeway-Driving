# M2: RL picks [lane command, speed command] every 0.5 s; quintic lateral to the target lane + accel-limited speed
# profile; cascaded PID tracks it. No safety layer: braking for cars is the RL's job (src/handoff/m2.py).
experiment:
  method: m2

method:
  name: m2
  decision_period: 5           # N2 control steps (0.5 s)
  trajectory:
    horizon: 2.0               # T_traj (s). With replanning every 0.5 s the flown path follows a target path when
                               # the target is read ~0.65 T ahead: human labels 1.3 s ahead reproduce the human drives
                               # to 0.14 m rms, no timing offset (docs/m2-reference-timing.md). 1.5 s fit better
                               # (0.09 m) but an RL step of one lane then peaks ~9 m/s^2, at MetaDrive's grip: the PID
                               # overshot 1.6 m and left the road (validate check m2). 2.0 s: ~5 m/s^2
    dt: 0.1
    accel_limit: 2.0           # speed-profile acceleration limit (m/s^2)
    decel_limit: 4.0           # speed-profile deceleration limit (m/s^2)
  pid:
    # Tuned 2026-11-19 on the kinematic bicycle + 0.12 s steering lag (scripts/matlab/m2_pid_tuning.m).
    # Was heading [1.7, 0.01, 3.5], lateral [0.3, 0.002, 0.05], speed [0.6, 0.02, 0.0] (MetaDrive LaneChangePolicy).
    heading: [1.0, 0.005, 0.0]
    lateral: [0.06, 0.0005, 0.0]
    speed: [0.25, 0.0008, 0.0] # on (v_ref - v) in m/s -> throttle_brake
    integral_limit: 5.0
    speed_feedforward: true    # add a_ref -> throttle_brake feed-forward from the actuation table

training:                      # 7.5 h job: the wall clock (450 min) is the stop; budget above what it can reach
  total_control_steps: 20000000
  max_wall_minutes: 450
  init_default_prob: [0.95, 0.8]   # [keep lane, hold speed]: a lane change tried every ~10 s, the target speed
                               # moved +-10 km/h on 20 % of decisions (equally often up and down), at first

ppo:                           # round 2: more updates per control step (pilot: ~14 updates in 2M steps)
  n_steps: 256                 # decisions per env per rollout (= 128 s of driving, same as M1/M3)
  batch_size: 256
  n_epochs: 4                  # round 3: update guard (approx_kl rose 0.006 -> 0.55, clip fraction 0.66, eval
  target_kl: 0.03              # success 1.0 -> 0 after 1.2M steps); same guard as M1, plus a smaller step size
  learning_rate: 0.0001
  ent_coef: 0.01               # discrete actions: a small entropy bonus keeps lane changes in play
