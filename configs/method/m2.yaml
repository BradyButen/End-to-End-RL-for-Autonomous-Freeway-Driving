# M2: RL picks (d*, v*); quintic lateral + accel-limited speed profile; cascaded PID tracks it.
experiment:
  method: m2

method:
  name: m2
  decision_period: 5           # N2 control steps (0.5 s)
  lateral_margin: 1.0          # d* range = [d_min - margin, d_max + margin]  (NOT clipped)
  trajectory:
    horizon: 2.0               # T_traj (s)
    dt: 0.1
    accel_limit: 2.0           # speed-profile acceleration limit (m/s^2)
    decel_limit: 4.0           # speed-profile deceleration limit (m/s^2)
    replan_from: reference     # initial (d_dot, d_ddot) from previous reference ("reference") or measured
  pid:
    heading: [1.7, 0.01, 3.5]  # from MetaDrive LaneChangePolicy
    lateral: [0.3, 0.002, 0.05]
    speed: [0.6, 0.02, 0.0]    # on (v_ref - v) in m/s -> throttle_brake
    integral_limit: 5.0
    speed_feedforward: true    # add a_ref -> throttle_brake feed-forward from the actuation table

ppo: {}
