# M3: RL picks up to 5 sparse Frenet waypoints + a target speed v*; spline; MPC in the road-aligned corridor,
# with the blocked-path emergency-brake gate. Same pipeline as scripts/m3_harness.py (2026-11-19); the safe-set
# projection is off (harness-exact).
experiment:
  method: m3

method:
  name: m3
  decision_period: 10          # N3 control steps (1.0 s); fixed-period trigger (DECISIONS D-04)
  n_slots: 5
  ds_range: [5.0, 40.0]        # per-slot Δs (m)
  speed_range_km_h: [20.0, 80.0]  # RL speed channel v*: spline speed, corridor speed ramp, MPC target AND hard
                               # speed ceiling. Floor 20 km/h: slowing below that for traffic is the corridor/MPC's
                               # job (the lead's keep-out face), so the RL cannot "park" to avoid risk.
  ebrake_gate: true            # emergency-brake (no MPC solve) when a car in the planned path (line ego -> next
                               # waypoint crosses its keep-out zone) is closed on faster than ebrake_gate_decel allows
  ebrake_gate_decel: 6.0       # m/s^2; gate fires when Δv²/(2·gap) exceeds this (MPC can plan down to -8)
  ebrake_ends_episode: true    # the gate, or an emergency brake after an INFEASIBLE MPC, ends the episode as
                               # "emergency_brake" (collision penalty); solver timeouts/failures never do
  lateral_margin: 1.0
  safe_set:
    enabled: false             # off: RL waypoints go straight to the spline (harness-exact, 2026-11-19)
    edge_margin: 0.2           # extra clearance to road edge beyond ego half-width (m)
    obj_margin_s: 2.0          # longitudinal inflation of object footprints (m)
    obj_margin_d: 0.5          # lateral inflation (m)
    time_uncertainty: 0.5      # footprint swept over ±τ s around predicted arrival time
    min_speed_for_timing: 5.0  # m/s, floor on ego speed when predicting arrival time
    max_slope: 0.16            # max |Δd|/Δs between consecutive waypoints (reachability)
    max_lat_accel: 3.0         # m/s^2; |Δd| <= a_lat·Δs²/(5.77 v²) (exact for the quintic spline segments)
    reach_time: 10.0           # waypoint s must be within s_ego + v_cap * reach_time
    min_ds: 2.0                # waypoints stay strictly increasing in s by at least this
    infeasible_penalty_distance: 10.0   # projection distance charged per dropped waypoint (m)
  spline:
    ds: 1.0                    # path sample spacing (m)
    extend: 80.0               # path is extended flat beyond the last waypoint (m)
  mpc:
    horizon: 50                # N (5.0 s at dt 0.1; was 20)
    steer_lag: 0.1             # s, first-order wheel-angle lag in the MPC model (measured)
    dt: 0.1
    weights:
      lateral: 2.0
      heading: 2.0
      speed: 0.5
      steer: 1.0
      accel: 0.05
      steer_rate: 20.0
      accel_rate: 0.5
      terminal_factor: 3.0
      yaw_rate: 20.0           # ((psi_k - psi_{k-1})/dt)^2, damps heading oscillation (harness)
    accel_bounds: [-8.0, 2.5]  # m/s^2 (was -6; -8 is about where MetaDrive braking stops being linear)
    max_lat_accel: 4.0         # m/s^2, |v² tan(δ)/L| bound
    ebrake_steer: [1.0, 0.3, 0.06]   # e-brake steering: heading, heading-rate damping, lane pull (command units)
    timeout_fallback_shift: 5  # solver timeout / numerical failure: replay the previous plan this many steps
                               # before an (episode-safe) emergency brake
    ceiling_brake: 4.0         # m/s^2; the v* speed ceiling ramps down from the current speed at this rate
    max_fallback_shift: 0      # steps of a stale plan to replay on a failed solve before emergency brake (was 5;
                               # 0 = brake immediately when no feasible plan exists)
    steer_rate_limit: 0.6      # rad/s
    corridor:                  # hard convex tube: 4 half-spaces per stage on the ego centre (DECISIONS D-13)
      type: road               # road = road-aligned corridor (RoadCorridor, harness default); stock = CorridorBuilder
      inset: -0.3              # road: lateral faces = exterior lane centres pulled in by this (negative = wider)
      keepout_s: 1.0           # road: car keep-out zone extends this far fore/aft of the car (m); also the gate
      barrier_weight: 1.0      # log barrier on the lateral faces within barrier_dist of them
      barrier_dist: 0.5
      barrier_inner_weight: 10.0
      barrier_inner_dist: 0.25
      horizon: 5.5             # s; must cover MPC horizon + rebuild period (51 stages needed for N = 50; was 3.0)
      rebuild_period: 1        # control steps between tube rebuilds: every step (was 10; 2026-11-19)
      margin_s: 1.0            # car inflation beyond ego half-length (m)
      margin_d: 0.3            # car inflation beyond ego half-width (m)
      edge_margin: 0.1         # road edge clearance beyond ego half-width (m)
      cap_forward: 20.0        # max box extent ahead of / behind / beside the trajectory point (m)
      cap_backward: 10.0
      cap_lateral: 5.25
      lane_change_heading: 0.035   # rad; above this the box follows the trajectory heading
      accel: 2.0               # initial-trajectory speed profile limits (m/s^2)
      brake: 4.0
      stop_buffer: 2.0         # stop this far behind the inflated footprint of a blocking car (m)
    solver:
      max_iter: 100
      max_cpu_time: 0.1        # IPOPT CPU limit (s, process CPU time, independent of node load); exceeding ->
                               # timeout fallback (stale plan, never ends the episode). Slow but successful
                               # solves are always used.
      tol: 0.001
      print_level: 0

ppo:                           # round 2: more updates per control step (pilot: ~7 updates in 2M steps)
  n_steps: 128                 # decisions per env per rollout (= 128 s of driving, same as M1/M2)
  batch_size: 256
