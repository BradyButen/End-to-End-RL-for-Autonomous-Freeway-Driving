# Reward r5: get to the end of the road as fast as possible, like an aggressive but competent driver.
# Raw terms: src/handoff/reward.py. Weights are per control step (0.1 s), so a weight of 0.1 = 1 per second.
#
# Driving faster than 60 km/h earns reward, slower costs, and a crash costs more than any finish:
#   progress    +0.5 /s at 80 km/h (0.0225 per m)         a little for every metre down the road
#   speed       +4 /s x (v / 80 km/h)^2                   driving fast
#   speed_gap   -42 /s x ((v - 80 km/h) / 80 km/h)^2      sets the break-even at 60 km/h; steepest when stopped
#   => net per second:  80 km/h +4.5 | 70 +2.8 | 60 0 | 50 -4.0 | 45 -6.5 | 40 -9.3 | 35 -12.3 | 20 -23 | stopped -42
#      Following the 35-45 km/h traffic costs every second: the push to pass.
#   success     +150                                      on reaching the end
#   collision / off_road   -4000                          worse than the worst possible finish, so crashing on
#                                                         purpose never pays
#   lane_keep   -20 /s x (offset / 1.75 m)^2              distance from the lane centre; -20 /s on a lane line
#   heading     -9 /s per rad beyond 0.5 deg              slow weaving
#   steer_rate  -0.6 /s per m/s^2 of change per step      rapid steering oscillation (as lateral accel at the speed)
#   headway     -5 /s x (1 - headway / 0.5 s)             tailgating closer than 0.5 s, or cutting in front of a car
#   lane_change: 0 (logged only)
#
# Rough episode scores on a ~1 km route (speed terms and the finish bonus only):
#   finish at 80 km/h (~45 s)                  ~ +350
#   finish at 60 km/h (~60 s)                  ~ +150
#   finish behind 45 km/h traffic (~80 s)      ~ -370
#   finish behind the 35 km/h lane (~103 s)    ~ -1120
#   crash                                      -4000 + whatever was earned before it
#   crawl at 4 km/h until the 150 s timeout    ~ -5700
experiment:
  reward_variant: r5

reward:
  name: r5
  weights:                     # per control step (0.1 s)
    progress: 0.0225           # per m            -> +0.5 /s at 80 km/h
    speed: 0.4                 # x (v/v_max)^2    -> +4 /s at 80 km/h
    speed_gap: 4.2             # x -(1 - v/v_max)^2  -> -42 /s when stopped; break-even with speed at 60 km/h
    success: 150.0
    collision: -4000.0
    off_road: -4000.0
    lane_keep: 2.0             # x -(offset / half a lane)^2  -> -20 /s on a lane line
    heading: 0.9               # per rad of heading error beyond 0.5 deg
    steer_rate: 0.06           # per m/s^2 change of the steering's lateral acceleration since the previous step
    headway: 0.5               # x -(1 - headway / 0.5 s)  -> -5 /s at contact
    lane_change: 0.0           # logged only (lane_changes metric)
