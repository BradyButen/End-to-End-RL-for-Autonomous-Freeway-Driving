# Robustness sweep (scripts/robustness.py): evaluate frozen policies under conditions they were not trained on.
# Each sweep varies ONE config key; everything else stays at the trained (nominal) value. A value equal to the
# nominal one is evaluated once and shared by every sweep. Values must be in the units of the config key.
#
# Nominal (training) conditions, from configs/scenario/freeway.yaml and configs/base.yaml:
#   density 0.15, traffic 40 km/h (lanes 45/40/35), ego static_default (fixed engine 800, brake 150)

nominal:
  scenario.traffic.density: 0.15
  scenario.traffic.speed_km_h: 40
  sim.ego.vehicle_model: static_default

sweeps:
  density:                      # more / fewer cars per lane
    key: scenario.traffic.density
    values: [0.10, 0.15, 0.20, 0.25]
  traffic_speed:                # slower traffic = more passing needed; faster = less room to pass
    key: scenario.traffic.speed_km_h
    values: [30, 40, 50]
  dynamics:                     # default = engine 750-850 / brake 80-180 resampled every episode (controllers
    key: sim.ego.vehicle_model  # were tuned on static_default; the pilot trained on default)
    values: [static_default, default]
