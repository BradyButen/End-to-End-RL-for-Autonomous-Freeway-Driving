# Stock MetaDrive straight freeway with MetaDrive's own traffic (PGTrafficManager, stock IDMPolicy cars at
# 30 km/h). Each seed = a different map (block lengths drawn from the seed) + traffic.
experiment:
  scenario: freeway

scenario:
  name: freeway
  traffic:
    density: 0.1          # MetaDrive traffic_density (vehicles per 10 m of lane, roughly)
    mode: Trigger         # MetaDrive TrafficMode: Basic | Trigger | Respawn

  seeds:
    # MetaDrive seeds. Training draws from [train_low, train_high); evaluation uses the fixed list below.
    train_low: 0
    train_high: 1000
    eval: [1000, 1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008, 1009,
           1010, 1011, 1012, 1013, 1014, 1015, 1016, 1017, 1018, 1019]
