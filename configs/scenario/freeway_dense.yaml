# Dense, slow traffic for aggressive driving: 22 background vehicles (fixed) at >= 10 m
# centre spacing, spread along the whole route in all lanes, every traffic vehicle (lead included) at
# 30 km/h. Ego target speed 70 km/h; ego spawns at 40-70 km/h.
# Use with: --scenario freeway_dense
experiment:
  scenario: freeway_dense

sim:
  target_speed_km_h: 70          # ego desired speed (same as base.yaml; stated here explicitly)

scenario:
  name: freeway_dense
  ego:
    s0: 80.0
    lanes: [0, 1, 2]
    speed_km_h: [40.0, 70.0]     # spawn speed (>= 40 km/h)
  lead:
    vehicle_model: xl
    speed_km_h: [30.0, 30.0]
    gap: [25.0, 60.0]
    lane_change: false
  background:
    count: [22, 22]              # fixed (32 reduced by 30%)
    lanes: all                   # includes the ego lane (cars may sit between the ego and the lead)
    s_range: [15.0, 900.0]       # absolute placement along the whole route (overrides s_offset)
    s_offset: [-60.0, 100.0]     # unused when s_range is set
    speed_km_h: [30.0, 30.0]
    min_spacing: 10.0            # min centre spacing per lane (also keeps clear of the ego/lead spawn points)
    lane_change: false
    vehicle_models: [default, s, m, l]
    s_bounds: [15.0, 900.0]

  seeds:
    train_low: 0
    train_high: 900000
    eval: [1000000, 1000001, 1000002, 1000003, 1000004, 1000005, 1000006, 1000007, 1000008, 1000009,
           1000010, 1000011, 1000012, 1000013, 1000014, 1000015, 1000016, 1000017, 1000018, 1000019]
