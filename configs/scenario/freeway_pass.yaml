# Fixed straight 3-lane freeway, slow XL lead vehicle in the ego lane, IDM background traffic.
experiment:
  scenario: freeway_pass

scenario:
  name: freeway_pass
  ego:
    s0: 80.0                     # ego spawn arc length (m from route start)
    lanes: [0, 1, 2]             # candidate initial lanes (0 = leftmost, next to the median)
    speed_km_h: [40.0, 70.0]     # uniform range
  lead:
    vehicle_model: xl            # XLVehicle 5.74 x 2.3 m (semi stand-in)
    speed_km_h: [30.0, 45.0]
    gap: [25.0, 60.0]            # bumper-to-bumper gap ahead of ego (m)
    lane_change: false
  background:
    count: [0, 4]                # inclusive integer range
    lanes: other                 # "other" = any lane except the ego/lead lane
    s_offset: [-60.0, 100.0]     # relative to ego s0 (m), centre-to-centre
    speed_km_h: [55.0, 75.0]
    min_spacing: 15.0            # min centre spacing between vehicles in the same lane (m)
    lane_change: false           # keeps the lead the front-most vehicle in the ego lane (DECISIONS D-08)
    vehicle_models: [default, s, m, l]
    s_bounds: [15.0, 900.0]      # clamp absolute spawn s to the road

  seeds:
    # Training episodes draw seeds from [train_low, train_high); evaluation uses the fixed list below.
    train_low: 0
    train_high: 900000
    eval: [1000000, 1000001, 1000002, 1000003, 1000004, 1000005, 1000006, 1000007, 1000008, 1000009,
           1000010, 1000011, 1000012, 1000013, 1000014, 1000015, 1000016, 1000017, 1000018, 1000019]
