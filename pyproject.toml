[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "handoff"
version = "0.1.0"
description = "Nav 565 Team 16: where should learning hand off to control? (MetaDrive freeway study)"
requires-python = ">=3.10,<3.13"
dependencies = [
    # MetaDrive: the PyPI 0.4.3 wheel is capped at Python <3.12 and pins panda3d 1.10.13 (no cp312 wheels).
    # GitHub main lifts both; pinned to an exact commit for reproducibility. See docs/DECISIONS.md (D-01).
    "metadrive-simulator @ git+https://github.com/metadriverse/metadrive.git@fe54b03327b14bcfc17a9a04b60c8abbee4d7ab1",
    "gymnasium>=1.0",
    "numpy>=1.26",
    "torch>=2.2",
    "stable-baselines3>=2.3",
    "casadi>=3.6",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "sim: tests that start a MetaDrive instance (slower; one MetaDrive per process)",
]
addopts = "-q"

[tool.ruff]
line-length = 120
extend-exclude = ["scripts/debug"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B905"]
