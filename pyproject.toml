[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "handoff"
version = "0.1.0"
description = "Where should learning hand off to control? RL vs. RL + PID vs. RL + MPC on a MetaDrive freeway"
requires-python = ">=3.10,<3.13"
dependencies = [
    # MetaDrive: the PyPI 0.4.3 wheel is capped at Python <3.12 and pins panda3d 1.10.13 (no cp312 wheels).
    # GitHub main lifts both; pinned to an exact commit for reproducibility.
    "metadrive-simulator @ git+https://github.com/metadriverse/metadrive.git@fe54b03327b14bcfc17a9a04b60c8abbee4d7ab1",
    "gymnasium>=1.0",
    "numpy>=1.26",
    "torch>=2.2",
    "stable-baselines3>=2.3",
    "casadi>=3.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741", "B905"]
